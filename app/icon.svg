<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b1218"/>
      <stop offset="1" stop-color="#3a080c"/>
    </linearGradient>
    <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e7d8"/>
      <stop offset="1" stop-color="#e2c98f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2c98f"/>
      <stop offset="1" stop-color="#c9a35c"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="60%" r="60%">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#ffd24d"/>
      <stop offset="100%" stop-color="#ff8a1e"/>
    </radialGradient>
  </defs>

  <!-- latar bulat maroon -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#c9a35c" stroke-opacity="0.55" stroke-width="1.6"/>

  <!-- lilin -->
  <rect x="29.4" y="13.5" width="5.2" height="13" rx="2.4" fill="#f6e7d8"/>
  <rect x="29.4" y="13.5" width="5.2" height="13" rx="2.4" fill="none" stroke="#c9a35c" stroke-opacity="0.5" stroke-width="0.8"/>
  <!-- garis lilin -->
  <path d="M29.4 17.5 L34.6 19.5 M29.4 21.5 L34.6 23.5" stroke="#d98a97" stroke-width="1.1" stroke-linecap="round"/>
  <!-- api -->
  <ellipse cx="32" cy="9.6" rx="3.4" ry="5.2" fill="url(#flame)"/>
  <ellipse cx="32" cy="10.6" rx="1.5" ry="2.6" fill="#fff3c4"/>

  <!-- badan kue -->
  <path d="M14 47 v-12 a6 6 0 0 1 6 -6 h24 a6 6 0 0 1 6 6 v12 z" fill="url(#cake)"/>
  <!-- lapisan gula -->
  <path d="M14 35 a6 6 0 0 1 6 -6 h24 a6 6 0 0 1 6 6 v2.4 c-2.4 1.8 -4.8 1.8 -7.2 0 c-2.4 -1.8 -4.8 -1.8 -7.2 0 c-2.4 1.8 -4.8 1.8 -7.2 0 c-2.4 -1.8 -4.8 -1.8 -7.2 0 c-2.4 1.8 -4.8 1.8 -7.2 0 z" fill="#d98a97"/>
  <!-- list bawah emas -->
  <rect x="14" y="44.6" width="36" height="2.6" fill="url(#gold)"/>
  <!-- alas piring -->
  <rect x="11" y="47" width="42" height="3.6" rx="1.8" fill="url(#gold)"/>
  <!-- garis hias -->
  <path d="M19 41 h2 M24 41 h2 M29 41 h2 M34 41 h2 M39 41 h2 M44 41 h1" stroke="#c9a35c" stroke-opacity="0.55" stroke-width="1.1" stroke-linecap="round"/>
